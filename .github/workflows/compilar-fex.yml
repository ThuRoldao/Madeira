name: Compilar FEX para iOS

on:
  push:
    branches: [diagnostico-wow64]
    paths:
      - .github/workflows/compilar-fex.yml

permissions:
  contents: read

jobs:
  fex:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar Madeira e dependencias do FEX
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Preparar ferramentas
        run: |
          mkdir -p reports
          git rev-parse HEAD | tee reports/commit.txt
          git submodule status --recursive | tee reports/submodules.txt
          xcodebuild -version | tee reports/xcode.txt
          brew install cmake ninja 2>&1 | tee reports/ferramentas.log
          python3 --version

      - name: Adaptar consulta de diagnostico para a plataforma
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          p = Path("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp")
          s = p.read_text(encoding="utf-8")
          old = '  MEMORY_BASIC_INFORMATION mbi {};\n  const char* type = "?";\n  if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {\n    type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";\n  }\n  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "\n                    "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",\n                    Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,\n                    (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,\n                    mbi.Protect, type, mbi.State);'
          new = '#ifdef _WIN32\n  MEMORY_BASIC_INFORMATION mbi {};\n  const char* type = "?";\n  if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {\n    type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";\n  }\n  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "\n                    "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",\n                    Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,\n                    (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,\n                    mbi.Protect, type, mbi.State);\n#else\n  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "\n                    "| region query unavailable on this platform",\n                    Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15);\n#endif'
          if s.count(old) != 1:
              raise SystemExit("Trecho esperado nao encontrado uma unica vez; ajuste interrompido.")
          updated = s.replace(old, new, 1)
          p.write_text(updated, encoding="utf-8")
          patch = "".join(difflib.unified_diff(s.splitlines(True), updated.splitlines(True), fromfile="a/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp", tofile="b/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp"))
          Path("reports/fex-diagnostico-plataforma.patch").write_text(patch, encoding="utf-8")
          print("Consulta VirtualQuery limitada ao alvo Windows; mensagem nativa preservada.")
          PY
          git -C FEX diff --check

      - name: Configurar FEX para iOS arm64
        run: |
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER="$(xcrun -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun -f clang++)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_C_FLAGS=-fno-stack-protector -DFEX_IOS_HOST=1" \
            "-DCMAKE_CXX_FLAGS=-fno-stack-protector -DFEX_IOS_HOST=1" \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_unordered_dense=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_range-v3=ON \
            -DBUILD_TESTING=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_FEXCONFIG=OFF -DBUILD_THUNKS=OFF \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
            -DTUNE_CPU=none -DTUNE_ARCH=generic \
            2>&1 | tee reports/fex-configure.log

      - name: Compilar bibliotecas estaticas do FEX
        run: |
          cmake --build FEX/build-ios --parallel 3 \
            --target FEXCore FEXCore_Base JemallocLibs fmt cephes_128bit xxhash softfloat_3e \
            2>&1 | tee reports/fex-build.log

      - name: Conferir bibliotecas exigidas pelo aplicativo
        run: |
          for lib in \
            FEXCore/Source/libFEXCore.a \
            FEXCore/Source/libFEXCore_Base.a \
            FEXCore/Source/libJemallocLibs.a \
            External/fmt/libfmt.a \
            External/cephes/libcephes_128bit.a \
            External/xxhash/cmake_unofficial/libxxhash.a \
            External/SoftFloat-3e/libsoftfloat_3e.a
          do
            test -s "FEX/build-ios/$lib"
            xcrun lipo -info "FEX/build-ios/$lib"
          done | tee reports/fex-bibliotecas.txt

      - name: Empacotar bibliotecas e cabecalhos gerados
        run: |
          find FEX/build-ios -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.inl' \) -print0 \
            | tar -czf fex-ios.tar.gz --null -T -
          echo 'Bibliotecas estaticas do FEX compiladas para iOS arm64. Ainda nao foi gerado nem testado um IPA.' >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar FEX compilado
        uses: actions/upload-artifact@v7
        with:
          name: fex-ios
          path: fex-ios.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Salvar relatorios mesmo em caso de erro
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-fex
          retention-days: 7
          path: |
            reports/
            FEX/build-ios/CMakeCache.txt
            FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
